<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Main Store</title>
    <link rel="icon" type="image/png" href="icons/main.store.icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm border-0 p-4">
                    <div class="text-center mb-3">
                        <img src="icons/main.store.icon.png" alt="Main Store" width="56" height="56" class="rounded-circle object-fit-cover mb-2">
                        <h1 class="h4 mb-1">Register User</h1>
                        <p class="text-muted small mb-0">Create your account to get started.</p>
                    </div>

                    <form name="register-form" action="signup.php" method="post">
                        <div class="row">
                            <div class="col-12 col-sm-6 mb-3">
                                <label for="fname" class="form-label">Firstname</label>
                                <input id="fname" type="text" name="fname" class="form-control" placeholder="Pepito" required>
                            </div>

                            <div class="col-12 col-sm-6 mb-3">
                                <label for="lname" class="form-label">Lastname</label>
                                <input id="lname" type="text" name="lname" class="form-control" placeholder="Perez" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="idnumber" class="form-label">Identification Number</label>
                            <input id="idnumber" type="text" name="idnumber" class="form-control" placeholder="1234567890" required>
                        </div>

                        <div class="mb-3">
                            <label for="mphone" class="form-label">Mobile Phone</label>
                            <input id="mphone" type="text" name="mphone" class="form-control" placeholder="3133333333" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-Mail</label>
                            <input id="email" type="email" name="email" class="form-control" placeholder="alguien@mail.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="pswd" class="form-label">Password</label>
                            <input id="pswd" type="password" name="pswd" class="form-control" placeholder="Algun123*" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Register</button>
                            <a href="../index.html" class="btn btn-link btn-sm text-decoration-none text-muted">Back to start</a>
                        </div>
                    </form>

                    <hr class="my-3">
                    <p class="text-center small mb-0">
                        Already have an account? <a href="signin.html">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
